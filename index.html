<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
    <meta name="theme-color" content="#1b4332"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-title" content="Diet Tracker"/>
    <title>Diet Tracker — Belly Fat Plan</title>
    
    <link rel="manifest" href="manifest.json"/>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>

    <!-- ==================== ALL YOUR APP HTML CONTENT ==================== -->
    
    <div id="install-banner" class="install-banner">
        <span class="inst-text">📲 Install app on your phone</span>
        <button class="inst-btn" id="install-btn">Install</button>
    </div>

    <div class="hdr">
        <div class="hdr-circle"></div>
        <h1>🥗 Diet Tracker</h1>
        <p class="hdr-sub" id="hdr-date">Loading...</p>
        <!-- Header content remains the same (score cards, bars, etc.) -->
        <!-- ... (All your existing HTML from original file stays here) ... -->
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(0)">✅ Checklist</button>
        <button class="tab-btn" onclick="switchTab(1)">🔥 Calories</button>
        <button class="tab-btn" onclick="switchTab(2)">💧 Activity</button>
        <button class="tab-btn" onclick="switchTab(3)">📅 History</button>
        <button class="tab-btn" onclick="switchTab(4)">⚙️ Settings</button>
    </div>

    <!-- All your tab contents (tab-0, tab-1, tab-2, etc.) go here -->
    <!-- Copy all the <div class="content"> ... </div> sections from your old file -->

    <div class="footer-note">Data saves on your phone · Calories are approximate</div>
    <div class="toast" id="toast"></div>

    <!-- Load JavaScript -->
    <script src="app.js"></script>
</body>
</html>
