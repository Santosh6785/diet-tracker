name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Bump version numbers
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          sed -i "s/BUILD_VERSION_[0-9]*/BUILD_VERSION_$TIMESTAMP/g" sw.js
          sed -i "s/BUILD_VERSION_[0-9]*/BUILD_VERSION_$TIMESTAMP/g" index.html
          echo "{\"version\":\"BUILD_VERSION_$TIMESTAMP\"}" > version.json
          echo "All versions bumped to BUILD_VERSION_$TIMESTAMP"

      - uses: actions/setup-node@v3
        with:
          node-version: '20'

      - run: npm install -g firebase-tools

      - run: firebase deploy --only hosting --project diet-tracker-app-c22f4 --token "${{ secrets.FIREBASE_TOKEN }}"
