name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump version numbers
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          sed -i "s/BUILD_VERSION_[0-9]*/BUILD_VERSION_$TIMESTAMP/g" sw.js
          sed -i "s/BUILD_VERSION_[0-9]*/BUILD_VERSION_$TIMESTAMP/g" index.html
          echo "{\"version\":\"BUILD_VERSION_$TIMESTAMP\"}" > version.json
          echo "All versions bumped to BUILD_VERSION_$TIMESTAMP"

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: diet-tracker-app-c22f4
          channelId: live
