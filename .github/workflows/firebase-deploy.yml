name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Bump version numbers
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          # Bump SW cache version
          sed -i "s/BUILD_VERSION_[0-9]*/BUILD_VERSION_$TIMESTAMP/g" sw.js
          # Bump app version meta tag in HTML
          sed -i "s/BUILD_VERSION_[0-9]*/BUILD_VERSION_$TIMESTAMP/g" index.html
          # Bump version.json
          echo "{\"version\":\"BUILD_VERSION_$TIMESTAMP\"}" > version.json
          echo "All versions bumped to BUILD_VERSION_$TIMESTAMP"

      - name: Copy files to public folder
        run: |
          mkdir -p public
          cp index.html public/index.html
          cp sw.js public/sw.js
          cp manifest.json public/manifest.json
          cp icon-192.png public/icon-192.png
          cp icon-512.png public/icon-512.png
          cp version.json public/version.json
          cp firebase.json public/../firebase.json

      - name: Deploy to Firebase
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          PROJECT_ID: diet-tracker-app-c22f4
