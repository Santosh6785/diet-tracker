name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bump version numbers
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          sed -i "s/BUILD_VERSION_[0-9]*/BUILD_VERSION_$TIMESTAMP/g" sw.js
          sed -i "s/BUILD_VERSION_[0-9]*/BUILD_VERSION_$TIMESTAMP/g" index.html
          echo "{\"version\":\"BUILD_VERSION_$TIMESTAMP\"}" > version.json
          echo "All versions bumped to BUILD_VERSION_$TIMESTAMP"

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SA" > /tmp/service-account.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/service-account.json firebase deploy --only hosting --project diet-tracker-app-c22f4
